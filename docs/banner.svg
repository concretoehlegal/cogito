<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="COGITO: Escritor, Planejador de Campanhas e Bestiário">
  <defs>
    <radialGradient id="bg" cx="0.28" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.6" stop-color="#0f0f0f"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <!-- círculo de runas -->
  <g transform="translate(1105 200) scale(0.82)">
    <circle r="230" fill="url(#ember)"/>
    <g fill="none" stroke="#ff9a3c" stroke-opacity="0.5" stroke-width="2.4" filter="url(#soft)">
      <circle r="150"/><circle r="122"/>
      <polygon points="0,-122 105.7,61 -105.7,61"/>
      <circle r="44"/><circle r="16"/>
      <path d="M0 -190 V190 M-190 0 H190" stroke-opacity="0.35"/>
      <g stroke-width="1.8">
        <rect x="-7" y="-143" width="14" height="14" rx="2"/><rect x="-7" y="129" width="14" height="14" rx="2"/>
        <rect x="129" y="-7" width="14" height="14" rx="2"/><rect x="-143" y="-7" width="14" height="14" rx="2"/>
        <rect x="93" y="-102" width="14" height="14" rx="2"/><rect x="-107" y="88" width="14" height="14" rx="2"/>
        <rect x="88" y="88" width="14" height="14" rx="2"/><rect x="-102" y="-102" width="14" height="14" rx="2"/>
      </g>
    </g>
  </g>
  <!-- logo -->
  <g transform="translate(96 96) scale(3.2)" fill="#b8ff2c" filter="url(#glow)">
    <path fill-rule="evenodd" d="M34.3 4.5 L37.0 14.7 L44.7 11.2 L42.8 19.0 L55.2 18.7 L45.2 25.5 L52.4 30.6 L43.4 32.1 L47.8 41.4 L38.0 36.8 L35.7 44.1 L30.7 38.1 L23.7 44.8 L23.8 35.5 L15.2 36.9 L19.5 29.9 L8.0 26.9 L19.2 23.1 L13.4 16.0 L22.9 17.2 L21.6 7.1 L29.6 14.1Z M20.5 26.6C26 18.8 38 18.8 43.5 26.6C38 33.6 26 33.6 20.5 26.6Z"/>
    <circle cx="32.6" cy="26.4" r="4.3"/>
    <path d="M27.6 37.5 L21.8 47.2 L27.4 56.6 M37 37.5 L42.4 45.6 L38.6 55.8 L47.4 55.8" fill="none" stroke="#b8ff2c" stroke-width="6.2" stroke-miterlimit="8"/>
  </g>
  <text x="330" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="22" fill="#fafafa">COGITO</text>
  <text x="334" y="246" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#a3a3a3">Escreva livros de RPG, planeje campanhas e cace criaturas.</text>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
