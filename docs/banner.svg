    <text x="393" y="305" text-anchor="middle" fill="#0a0a0a">Escritor</text>
    <rect x="464" y="280" width="232" height="38" rx="19" fill="#171717" stroke="#373737"/>
    <text x="580" y="305" text-anchor="middle" fill="#e5e5e5">Planejador de Campanhas</text>
    <rect x="708" y="280" width="122" height="38" rx="19" fill="#171717" stroke="#373737"/>
    <text x="769" y="305" text-anchor="middle" fill="#e5e5e5">Bestiário</text>
  </g>
  <text x="334" y="356" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#737373">Windows · 100% offline · seus dados ficam no seu computador</text>
